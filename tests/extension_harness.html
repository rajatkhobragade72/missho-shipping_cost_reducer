<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fake Meesho panel</title></head>
<body>
  <!--
    Manual test page for extension/content.js, shaped like the real Meesho single-catalog page
    (from a user page report): #changeFrontImage (front, behind a "CHANGE" link),
    #addMoreImagesInput (multiple), #getFile ("Add Product", must never be touched), MUI-style
    "Meesho Price" + "*" labels, and a Bank Settlement Breakdown that only recalculates when the
    price/weight field changes. Serve this file next to a copy of extension/content.js (temp dir +
    `python -m http.server`), open /extension_harness.html in headless Edge with --dump-dom
    --virtual-time-budget=400000. The title ends up as "DONE hero=<result> | others=<n> | <status>".
  -->
  <div><p>Add Product</p><input type="file" id="getFile" accept="image/x-png,image/jpeg"></div>
  <h3>Uploaded Images</h3>
  <div id="images" style="display:flex;gap:16px">
    <div class="MuiBox-root">
      <div class="thumb"><img id="front-img" alt="" width="80"></div>
      <div class="MuiBox-root"><p>Front Image</p><p style="color:red">*</p></div>
      <span id="change" style="color:#33c;cursor:pointer">CHANGE</span>
    </div>
    <input type="file" id="addMoreImagesInput" accept="image/x-png, image/jpeg" multiple style="display:none">
    <input type="file" id="changeFrontImage" accept="image/x-png, image/jpeg" style="display:none">
  </div>
  <div class="MuiGrid-root">
    <div class="MuiBox-root"><div><p>Meesho Price</p><p>*</p></div><div class="MuiFormControl-root"><div><input id="price" name="meesho_price" type="text" value="101"></div></div></div>
    <div class="MuiBox-root"><div><p>Net Weight (gms)</p><p>*</p></div><div class="MuiFormControl-root"><div><input id="weight" type="text" value="300"></div></div></div>
    <div class="MuiBox-root"><div><p>Product Name</p></div><div><input id="pname" type="text" value="Microfiber Cloth"></div></div>
    <div class="MuiBox-root"><div><p>Product Length</p></div><div><input id="product_length" type="text" value="40"></div></div>
    <div class="MuiBox-root"><div><p>Product Breadth</p></div><div><input id="product_breadth" type="text" value="30"></div></div>
  </div>
  <div class="breakdown">
    <h4>Bank Settlement Breakdown</h4>
    <div><p>Meesho price</p><p>₹101</p></div>
    <div><p>Shipping Charges</p><p id="ship-val">₹90</p></div>
  </div>
  <script>
    function makeImage(color, w, h) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, w, h);
      x.fillStyle = color; x.fillRect(w * 0.2, h * 0.2, w * 0.6, h * 0.6);
      return new Promise((r) => c.toBlob(r, "image/jpeg", 0.9));
    }
    makeImage("#c2185b", 600, 800).then((b) => { document.getElementById("front-img").src = URL.createObjectURL(b); });

    document.getElementById("getFile").addEventListener("change", () => { window.__touchedGetFile = true; });
    document.getElementById("change").addEventListener("click", () => document.getElementById("changeFrontImage").click());
    document.getElementById("changeFrontImage").addEventListener("change", (e) => {
      const f = e.target.files[0];
      document.getElementById("front-img").src = URL.createObjectURL(f);
      window.__front = f;
    });

    // Like the real panel (as reported): the breakdown only recalculates when price/weight change.
    for (const id of ["price", "weight"]) {
      document.getElementById(id).addEventListener("input", (e) => {
        const f = window.__front;
        if (!f || !e.target.value) return;
        (window.__priceEvents ||= []).push(`${id}:${f.name}@${Date.now() - window.__t0}`);
        setTimeout(() => {
          // ?hit=1: the first photo costs exactly 40 so the "target reached" path gets tested.
          const hit = new URLSearchParams(location.search).has("hit") && !window.__hitDone;
          if (hit) window.__hitDone = true;
          const cost = hit ? 40 : 40 + (f.size % 60);
          (window.__costs ||= []).push(`${f.name}:${cost}${hit ? "(hit)" : ""}`);
          document.getElementById("ship-val").textContent = `₹${cost}`;
          window.__lastApplied = `${f.name} ${cost}`;
        }, 1000);
      });
    }

    window.__others = [];
    document.getElementById("addMoreImagesInput").addEventListener("change", (e) => {
      for (const f of e.target.files) {
        window.__others.push(f.name);
        document.getElementById("images").append(Object.assign(document.createElement("img"), { src: URL.createObjectURL(f), width: 60 }));
      }
    });

    // Headless has nobody to answer "AI photo lagayein?" dialogs: count them and say yes.
    window.__confirms = 0;
    window.confirm = () => { window.__confirms++; return true; };
    window.__errors = [];
    window.addEventListener("error", (e) => window.__errors.push(`err: ${e.message || e.error}`));
    window.addEventListener("unhandledrejection", (e) => window.__errors.push(`rej: ${e.reason?.message || e.reason}`));
    const attach = Element.prototype.attachShadow;
    Element.prototype.attachShadow = function (opts) { return attach.call(this, { ...opts, mode: "open" }); };
    window.chrome = {
      runtime: { id: "test", onMessage: { addListener() {} },
        // Fake local AI tool: two "different" photos of the product.
        async sendMessage(msg) {
          const toB64 = async (b) => { const u = new Uint8Array(await b.arrayBuffer()); let s = ""; for (const c of u) s += String.fromCharCode(c); return btoa(s); };
          if (msg.type === "ping") return { ok: true, data: {} };
          if (msg.type === "aiVariants") return { ok: true, data: { session: "s", failed: 0,
            images: [{ name: "ai_a.jpg", label: "AI: angle" }, { name: "ai_b.jpg", label: "AI: compact" }] } };
          if (msg.type === "localImage") return { ok: true, data: { b64: await toB64(await makeImage(msg.name === "ai_a.jpg" ? "#ff9800" : "#4caf50", 700, 700)) } };
          return { ok: false, error: "no background in harness" };
        } },
      storage: { local: {
        async get() {
          // ?target=45&tv=1 lets the test check how the target field is restored.
          const q = new URLSearchParams(location.search);
          const target = q.has("target") ? Number(q.get("target")) : 0;
          return { shipOptimizerCfg: { tries: 5, target, targetVersion: q.has("tv") ? 2 : undefined, stickers: true, sameFrame: true, waitSec: 3, stepWaitSec: 1,
            uploadMethod: "input", steps: [], useAI: true, refreshPrice: true } };
        },
        async set() {},
      } },
    };
  </script>
  <script src="content.js"></script>
  <script>
    const panel = () => [...document.documentElement.children].find((e) => e.shadowRoot)?.shadowRoot;
    const button = (text) => [...panel().querySelectorAll("button")].find((b) => b.textContent.startsWith(text));
    const statusText = () => panel().querySelector(".body > div:not(.card):not(.row):not(.muted):not(.result)")?.textContent || "";
    const waitFor = async (re) => {
      while (!(typeof re === "function" ? re(statusText()) : re.test(statusText()))) await new Promise((r) => setTimeout(r, 500));
    };
    const progressTimer = setInterval(() => {
      if (!document.title.startsWith("DONE")) document.title = `RUN ${statusText()} | err=${window.__errors.join(" ; ")} | ${panel()?.querySelector("ol")?.textContent.slice(0, 300)}`;
    }, 1000);
    (async () => {
      window.__t0 = Date.now();
      await new Promise((r) => setTimeout(r, 2000));
      if (new URLSearchParams(location.search).has("preview")) {
        // ?preview=1: only render the look preview (take a screenshot to judge the styles).
        clearInterval(progressTimer);
        button("Pehle look").click();
        await waitFor(/pehli 6 photos|nahi mili/);
        // Measure every preview: how much of the frame the product covers (the shipping lever).
        const stats = [];
        for (const img of panel().querySelectorAll(".choice img")) {
          const c = document.createElement("canvas");
          c.width = 200; c.height = 200;
          const x = c.getContext("2d");
          x.drawImage(img, 0, 0, 200, 200);
          const d = x.getImageData(0, 0, 200, 200).data;
          let n = 0, minX = 200, maxX = -1, minY = 200, maxY = -1;
          for (let y = 0; y < 200; y++) for (let px = 0; px < 200; px++) {
            const i = (y * 200 + px) * 4;
            if (Math.abs(d[i] - 255) + Math.abs(d[i + 1] - 255) + Math.abs(d[i + 2] - 255) > 40) {
              n++; if (px < minX) minX = px; if (px > maxX) maxX = px; if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
          }
          stats.push(`${img.title}: cover=${(n / 40000 * 100).toFixed(0)}% box=${maxX < 0 ? "-" : ((maxX - minX) / 200 * 100).toFixed(0) + "%x" + ((maxY - minY) / 200 * 100).toFixed(0) + "%"}`);
        }
        document.title = `DONE preview cards=${panel().querySelectorAll(".choice").length} | ${stats.join(" | ")}`;
        const sheet = document.createElement("div");
        sheet.id = "sheet";
        sheet.style.cssText = "position:absolute;left:0;top:0;width:520px;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff";
        for (const img of panel().querySelectorAll(".choice img")) sheet.append(Object.assign(document.createElement("img"), { src: img.src, style: "width:100%" }));
        document.body.append(sheet);
        return;
      }
      button("1.").click();
      await waitFor(/Ab form check|Dobara|Roka|Lagta hai|nahi mili|NAHI/);
      const auto = panel().querySelector(".result").textContent;
      const cards = [...panel().querySelectorAll(".choice")];
      let picked = "no choices";
      if (cards.length > 1) {
        const want = cards[1].querySelector("img").title;
        const beforeApply = statusText();
        [...cards[1].querySelectorAll("button")].find((b) => b.textContent === "Ye lagao").click();
        // Wait for the apply to really finish: the panel is busy until the status changes and says so.
        await waitFor((s) => s !== beforeApply && /Ab form check/.test(s));
        picked = `cards=${cards.length} picked="${want}" applied=${window.__lastApplied} on=${panel().querySelectorAll(".choice.on").length}`;
      }
      const hero = `${auto} || ${picked}`;
      const files = await Promise.all(["#1976d2", "#388e3c"].map((c, i) => makeImage(c, 500, 500)
        .then((b) => new File([b], `extra${i}.jpg`, { type: "image/jpeg" }))));
      const dt = new DataTransfer();
      files.forEach((f) => dt.items.add(f));
      panel().querySelector("input[multiple]").files = dt.files;
      button("2.").click();
      await waitFor(/Neeche photos dekho|nahi mila|Pehle|asli photo chuno/);
      const extraLabels = [...panel().querySelectorAll(".choices")].pop().textContent;
      window.__extras = extraLabels.match(/\d\. [^A]*?(?=Asli|AI)/g)?.join(" / ");
      button("Chuni hui photos").click();
      await waitFor(/Photos laga di|nahi dikha|Koi photo/);
      button("Page report").click();
      await new Promise((r) => setTimeout(r, 500));
      // Sab details khol do (charge table) taaki screenshot me dikhe.
      for (const d of panel().querySelectorAll("details")) d.open = true;
      const t = panel().querySelector(".charge");
      const geo = t ? `tw=${Math.round(t.getBoundingClientRect().width)} pw=${Math.round(panel().querySelector(".body").getBoundingClientRect().width)} over=${t.scrollWidth > t.clientWidth}` : "no-table";
      clearInterval(progressTimer);
      document.title = `DONE hero=${hero} [${window.__lastApplied}] | extras=${window.__extras} | confirms=${window.__confirms} | others=${window.__others.join(",")} | getFile touched=${!!window.__touchedGetFile} | target=${panel().querySelector("#opt-target")?.value} tries=${panel().querySelector("#opt-tries")?.value} | costs=${(window.__costs || []).slice(0, 8).join(",")} | events=${(window.__priceEvents || []).slice(0, 8).join(",")} | table=${panel().querySelector(".charge")?.querySelectorAll("tbody tr").length} ${geo} rows=[${[...panel().querySelectorAll(".charge tbody tr")].map((tr) => tr.textContent.replace(/\s+/g, " ").trim()).join(" || ")}] | errors=${window.__errors.join(" ; ")} | secs=${Math.round((Date.now() - window.__t0) / 1000)} | ${statusText()}`;
      const pre = document.createElement("pre");
      pre.id = "report";
      pre.textContent = panel().querySelector("textarea").value;
      document.body.append(pre);
    })();
  </script>
</body>
</html>
