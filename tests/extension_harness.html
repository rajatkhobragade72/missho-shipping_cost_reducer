<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fake Meesho panel</title></head>
<body>
  <!--
    Manual test page for extension/content.js. Copy this file to app/static/_harness.html and
    extension/content.js to app/static/content.js, open /_harness.html (optionally ?method=drop),
    then delete both copies. The page title ends up as "DONE <last uploaded file> <cost>".
  -->
  <h3>Fake Meesho catalogue page</h3>
  <div class="upload-box" id="box" style="border:2px dashed #999;padding:20px">
    <input type="file" accept="image/jpeg,image/png" id="front" style="display:none">
    <img id="preview" alt="" width="80">
  </div>
  <button id="save" type="button">Save</button>
  <div class="breakdown">
    <div><span>Meesho Price</span> <span>₹101</span></div>
    <div id="ship"><span>Shipping (added separately)</span> <span id="ship-val">₹1,613</span></div>
  </div>
  <script>
    // Simulated Meesho: upload shows a preview; the charge only recalculates after "Save".
    let pending = null;
    const accept = (f) => { pending = f; document.getElementById("preview").src = URL.createObjectURL(f); };
    document.getElementById("front").addEventListener("change", (e) => accept(e.target.files[0]));
    const box = document.getElementById("box");
    box.addEventListener("dragover", (e) => e.preventDefault());
    box.addEventListener("drop", (e) => { e.preventDefault(); accept(e.dataTransfer.files[0]); });
    document.getElementById("save").addEventListener("click", () => {
      const f = pending;
      if (!f) return;
      setTimeout(() => {
        const cost = 30 + (f.size % 60);
        document.getElementById("ship-val").textContent = `₹${cost}`;
        window.__lastApplied = `${f.name} ${cost}`;
      }, 1000);
    });

    const method = new URLSearchParams(location.search).get("method") || "input";
    const attach = Element.prototype.attachShadow;
    Element.prototype.attachShadow = function (opts) { return attach.call(this, { ...opts, mode: "open" }); };
    const toB64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); };
    async function handle(msg) {
      if (msg.type === "ping") return { ok: true };
      if (msg.type === "latest") return (await fetch("/api/sessions/latest")).json();
      if (msg.type === "image") return { b64: toB64(new Uint8Array(await (await fetch(`/api/image/${msg.session}/${msg.name}`)).arrayBuffer())) };
      if (msg.type === "cost") {
        await fetch("/api/costs", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session: msg.session, name: msg.name, cost: msg.cost, source: "meesho" }) });
        return { ok: true };
      }
    }
    window.chrome = {
      runtime: { id: "test", onMessage: { addListener() {} },
        async sendMessage(msg) { try { return { ok: true, data: await handle(msg) }; } catch (e) { return { ok: false, error: e.message }; } } },
      storage: { local: {
        async get() {
          return { shipTesterCfg: { waitSec: 3, gapSec: 1, stepWaitSec: 1, onlyUntested: true, applyBest: true,
            uploadMethod: method, uploadSelector: method === "drop" ? "#box" : "", steps: [{ selector: "#save", label: "Save" }] } };
        },
        async set() {},
      } },
    };
  </script>
  <script src="content.js"></script>
  <script>
    let started = false;
    setTimeout(() => {
      const host = [...document.documentElement.children].find((e) => e.shadowRoot);
      [...host.shadowRoot.querySelectorAll("button")].find((b) => b.textContent === "Test all images").click();
      started = true;
    }, 2000);
    setInterval(() => {
      const host = [...document.documentElement.children].find((e) => e.shadowRoot);
      const status = host && host.shadowRoot.querySelector(".body > div:not(.sec)");
      if (started && status && /Laga di|Ho gaya|NAHI|nahi|same|Roka/.test(status.textContent)) {
        document.title = `DONE ${window.__lastApplied || "-"} | ${status.textContent}`;
      }
    }, 500);
  </script>
</body>
</html>
